<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Settings</title>
  <link rel="stylesheet" href="../shared/global.css">
  <style>
    body { display: flex; flex-direction: column; overflow: hidden; }
    .body { flex: 1; overflow-y: auto; padding: 28px 32px; max-width: 640px; width: 100%; display: flex; flex-direction: column; gap: 28px; }
    .section-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .settings-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .setting-row { display: flex; align-items: center; gap: 12px; }
    .setting-label { flex: 1; font-size: 14px; }
    .setting-label small { color: var(--text-muted); font-size: 12px; display: block; margin-top: 2px; }
    .setting-input { width: 180px; }
    .inline-save { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="btn btn-ghost btn-sm" id="btn-back">← Admin</button>
    <span class="topbar-title">Settings</span>
  </div>

  <div class="body scroll">
    <!-- Exchange rate -->
    <div>
      <div class="section-title">Currency</div>
      <div class="settings-card">
        <div class="setting-row">
          <div class="setting-label">
            USD → Lebanese Lira rate
            <small>Used for LBP display across the app</small>
          </div>
          <div class="inline-save">
            <input type="number" class="input setting-input" id="rate-input" min="1" step="1000">
            <button class="btn btn-primary btn-sm" id="btn-save-rate">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Admin names -->
    <div>
      <div class="section-title">Admin Profiles</div>
      <div class="settings-card">
        <div class="setting-row">
          <div class="setting-label">Admin 1 Name</div>
          <div class="inline-save">
            <input type="text" class="input setting-input" id="admin1-name-input" placeholder="Admin 1">
            <button class="btn btn-primary btn-sm" id="btn-save-admin1">Save</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">Admin 2 Name</div>
          <div class="inline-save">
            <input type="text" class="input setting-input" id="admin2-name-input" placeholder="Admin 2">
            <button class="btn btn-primary btn-sm" id="btn-save-admin2">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Change password -->
    <div>
      <div class="section-title">Security</div>
      <div class="settings-card" style="gap:20px">
        <div>
          <div style="font-size:14px;font-weight:600;margin-bottom:10px">Change App Password</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <input type="password" class="input" id="cur-pass" placeholder="Current password">
            <input type="password" class="input" id="new-pass" placeholder="New password">
            <button class="btn btn-secondary" id="btn-change-pass">Update Password</button>
          </div>
        </div>
        <hr class="divider">
        <div>
          <div style="font-size:14px;font-weight:600;margin-bottom:10px">Change Admin PIN</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <input type="password" class="input" id="cur-pin" placeholder="Current PIN" maxlength="4" inputmode="numeric">
            <input type="password" class="input" id="new-pin" placeholder="New PIN (4 digits)" maxlength="4" inputmode="numeric">
            <button class="btn btn-secondary" id="btn-change-pin">Update PIN</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="../shared/toast.js"></script>
  <script src="settings.js"></script>
</body>
</html>
