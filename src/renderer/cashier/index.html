<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Zawia Cafe POS — Cashier</title>
  <link rel="stylesheet" href="../shared/global.css">
  <style>
    body { display: flex; flex-direction: column; overflow: hidden; }

    .app-body { display: flex; flex: 1; overflow: hidden; }

    /* ── Left: category bar + item grid ── */
    .menu-panel { display: flex; flex-direction: column; flex: 1; overflow: hidden; border-right: 1px solid var(--border); }

    .cat-bar {
      display: flex; gap: 6px; padding: 10px 12px;
      background: var(--bg-surface); border-bottom: 1px solid var(--border);
      overflow-x: auto; flex-shrink: 0;
    }
    .cat-bar::-webkit-scrollbar { height: 4px; }
    .cat-bar::-webkit-scrollbar-thumb { background: var(--bg-card); }

    .cat-btn {
      padding: 7px 14px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--bg-card);
      color: var(--text-secondary); font-size: 13px; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    .cat-btn.active { background: var(--accent); color: #1a1200; border-color: var(--accent); font-weight: 700; }
    .cat-btn:hover:not(.active) { color: var(--text-primary); background: var(--bg-input); }

    .items-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px; padding: 14px; overflow-y: auto; align-content: start; flex: 1;
    }

    .item-card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 12px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      text-align: center; transition: border-color .15s, background .15s;
    }
    .item-card:hover { border-color: var(--accent); background: var(--bg-card); }
    .item-card:active { transform: scale(.96); }
    .item-name  { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
    .item-price { font-size: 15px; font-weight: 700; color: var(--accent); }

    .item-card.item-oos { opacity: 0.45; cursor: not-allowed; }
    .item-card.item-oos:hover { border-color: var(--border); background: var(--bg-surface); transform: none; }
    .item-card.item-oos:active { transform: none; }
    .oos-label { font-size: 11px; font-weight: 700; color: var(--danger); text-transform: uppercase; letter-spacing: 0.4px; }

    /* ── Right: cart ── */
    .cart-panel {
      width: 340px; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
    }

    .cart-header {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      background: var(--bg-surface); display: flex; align-items: center; gap: 8px;
    }
    .cart-header-title { font-weight: 700; font-size: 15px; flex: 1; }
    .table-badge {
      font-size: 12px; font-weight: 700; padding: 3px 10px;
      background: var(--accent); color: #1a1200; border-radius: 20px;
    }

    .cart-items { flex: 1; overflow-y: auto; padding: 8px 0; }

    .cart-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-bottom: 1px solid var(--border);
    }
    .cart-row:last-child { border-bottom: none; }
    .cart-row-label { flex: 1; font-size: 13px; }
    .cart-row-label small { color: var(--text-muted); font-size: 11px; display: block; }
    .cart-qty-controls { display: flex; align-items: center; gap: 6px; }
    .qty-btn {
      width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-primary); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .12s;
    }
    .qty-btn:hover { background: var(--bg-input); }
    .qty-num { width: 22px; text-align: center; font-size: 13px; font-weight: 600; }
    .cart-row-price { font-size: 13px; font-weight: 600; width: 64px; text-align: right; }
    .cart-remove { color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 2px 4px; }
    .cart-remove:hover { color: var(--danger); }

    .cart-footer {
      border-top: 1px solid var(--border); padding: 12px 14px;
      background: var(--bg-surface); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
    }
    .total-row { display: flex; justify-content: space-between; align-items: baseline; }
    .total-label { font-size: 13px; color: var(--text-secondary); }
    .total-usd   { font-size: 22px; font-weight: 800; color: var(--text-primary); }
    .total-lbp   { font-size: 12px; color: var(--text-muted); text-align: right; }
    .checkout-btns { display: flex; gap: 8px; }

    /* ── Session bar ── */
    .session-bar {
      min-height: 80px; border-top: 1px solid var(--border);
      background: var(--bg-surface); display: flex; align-items: center;
      gap: 10px; padding: 10px 14px; overflow-x: auto; flex-shrink: 0;
    }
    .session-bar::-webkit-scrollbar { height: 4px; }

    .session-chip {
      display: flex; align-items: center; gap: 12px;
      background: rgba(157,111,0,.07); border: 2px solid var(--warning);
      border-radius: 10px; padding: 10px 14px; cursor: pointer; white-space: nowrap;
      transition: all .15s; flex-shrink: 0;
    }
    .session-chip:hover { background: rgba(192,57,43,.07); border-color: var(--danger); }

    .chip-pulse {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--warning); flex-shrink: 0;
      animation: chip-blink 1.4s ease-in-out infinite;
    }
    @keyframes chip-blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .35; transform: scale(.65); }
    }

    .chip-body { display: flex; flex-direction: column; gap: 2px; min-width: 80px; }
    .chip-title { font-size: 13px; font-weight: 700; color: var(--text-primary); }
    .chip-sub   { font-size: 11px; color: var(--text-muted); }

    .chip-right { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
    .session-chip-time { font-size: 17px; font-weight: 700; font-family: 'Consolas', monospace; color: var(--warning); }
    .chip-cost { font-size: 13px; font-weight: 700; color: var(--accent); }

    .session-bar-add {
      padding: 10px 14px; font-size: 12px; font-weight: 600;
      background: transparent; border: 1px dashed var(--border);
      border-radius: 10px; color: var(--text-muted); cursor: pointer; white-space: nowrap;
      flex-shrink: 0; transition: border-color .15s, color .15s; align-self: stretch;
      display: flex; align-items: center;
    }
    .session-bar-add:hover { border-color: var(--accent); color: var(--accent); }

    /* ── PIN modal ── */
    .pin-dots { display: flex; gap: 12px; justify-content: center; margin: 16px 0; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); transition: background .15s; }
    .pin-dot.filled { background: var(--accent); border-color: var(--accent); }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pin-key {
      padding: 14px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-primary); font-size: 18px;
      font-weight: 600; cursor: pointer; text-align: center; transition: background .12s;
    }
    .pin-key:hover { background: var(--bg-input); }
    .pin-key.del { font-size: 14px; color: var(--text-muted); }
    .pin-key.zero { grid-column: 2; }

    /* ── Session modals ── */
    .session-type-btns { display: flex; gap: 8px; margin-bottom: 12px; }
    .session-type-btn {
      flex: 1; padding: 12px; border-radius: var(--radius-sm); border: 2px solid var(--border);
      background: var(--bg-card); color: var(--text-primary); font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .session-type-btn.active { border-color: var(--accent); color: var(--accent); }

    .cur-tog {
      padding: 3px 10px; border: none; background: var(--bg-card);
      color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .cur-tog.active { background: var(--accent); color: #1a1200; }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="btn btn-ghost btn-sm" id="btn-tables">← Tables</button>
    <span class="topbar-title" id="topbar-title">Cashier</span>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" id="btn-admin">Admin ▾</button>
    </div>
  </div>

  <div class="app-body">
    <div class="menu-panel">
      <div class="cat-bar" id="cat-bar"></div>
      <div class="items-grid scroll" id="items-grid"></div>
    </div>

    <div class="cart-panel">
      <div class="cart-header">
        <span class="cart-header-title">Order</span>
        <span class="table-badge" id="table-badge">—</span>
      </div>
      <div class="cart-items scroll" id="cart-items">
        <div class="empty-state" id="cart-empty">
          <div class="empty-state-icon">🛒</div>
          <div>Cart is empty</div>
        </div>
      </div>
      <div class="cart-footer">
        <div class="total-row">
          <span class="total-label">Total</span>
          <span class="total-usd" id="total-usd">$0.00</span>
        </div>
        <div class="total-lbp" id="total-lbp"></div>
        <div class="checkout-btns">
          <button class="btn btn-danger flex-1" id="btn-void">Clear</button>
          <button class="btn btn-secondary btn-sm" id="btn-discount">% Disc</button>
          <button class="btn btn-success" style="flex:2" id="btn-checkout">Checkout ✓</button>
        </div>
      </div>
    </div>
  </div>

  <div class="session-bar" id="session-bar">
    <span style="font-size:12px;color:var(--text-muted);flex-shrink:0">Sessions:</span>
    <button class="session-bar-add" id="btn-add-session">+ Start Session</button>
  </div>

  <!-- Admin PIN modal -->
  <div class="modal-overlay hidden" id="admin-pin-modal">
    <div class="modal-box">
      <div class="modal-title">Admin Access</div>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">Enter admin PIN to continue</div>
      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot"></div><div class="pin-dot"></div>
        <div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div id="pin-error" style="color:var(--danger);font-size:12px;text-align:center;min-height:16px;margin-bottom:8px"></div>
      <div class="pin-pad" id="pin-pad">
        <button class="pin-key" data-key="1">1</button>
        <button class="pin-key" data-key="2">2</button>
        <button class="pin-key" data-key="3">3</button>
        <button class="pin-key" data-key="4">4</button>
        <button class="pin-key" data-key="5">5</button>
        <button class="pin-key" data-key="6">6</button>
        <button class="pin-key" data-key="7">7</button>
        <button class="pin-key" data-key="8">8</button>
        <button class="pin-key" data-key="9">9</button>
        <button class="pin-key del" data-key="del">⌫</button>
        <button class="pin-key zero" data-key="0">0</button>
      </div>
      <div style="margin-top:14px">
        <button class="btn btn-ghost btn-full" id="pin-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Start session modal -->
  <div class="modal-overlay hidden" id="session-modal">
    <div class="modal-box">
      <div class="modal-title">Start Session</div>
      <div class="session-type-btns">
        <button class="session-type-btn active" data-type="playstation">🎮 PlayStation</button>
        <button class="session-type-btn" data-type="private_room">🚪 Private Room</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="field">
          <label>Label (optional)</label>
          <input type="text" class="input" id="session-label" placeholder="e.g. PS1, Room A">
        </div>
        <div class="field">
          <label>Billing</label>
          <select class="select" id="session-billing">
            <option value="hourly">Hourly</option>
            <option value="per_match">Per Match</option>
          </select>
        </div>
        <div class="field">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <label>Rate</label>
            <div style="display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden">
              <button type="button" class="cur-tog active" id="session-cur-usd">$ USD</button>
              <button type="button" class="cur-tog" id="session-cur-lbp">LL LBP</button>
            </div>
          </div>
          <input type="number" class="input" id="session-rate" placeholder="e.g. 5" min="0" step="0.5">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-ghost flex-1" id="session-cancel">Cancel</button>
        <button class="btn btn-primary flex-1" id="session-start">Start</button>
      </div>
    </div>
  </div>

  <!-- Close session modal -->
  <div class="modal-overlay hidden" id="close-session-modal">
    <div class="modal-box">
      <div class="modal-title" id="close-session-title">Close Session</div>
      <div id="close-session-info" style="font-size:13px;color:var(--text-secondary);margin-bottom:12px"></div>
      <div class="field" id="match-count-field" style="display:none;margin-bottom:12px">
        <label>Number of Matches</label>
        <input type="number" class="input" id="match-count-input" min="0" step="1" value="1">
      </div>
      <div style="background:var(--bg-card);border-radius:var(--radius-sm);padding:12px;margin-bottom:14px">
        <div style="font-size:13px;color:var(--text-secondary)">Total to bill</div>
        <div style="font-size:24px;font-weight:800;color:var(--accent)" id="close-session-total">$0.00</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost flex-1" id="close-session-cancel">Cancel</button>
        <button class="btn btn-success" style="flex:2" id="close-session-confirm">Add to Cart</button>
      </div>
    </div>
  </div>

  <!-- Discount modal -->
  <div class="modal-overlay hidden" id="discount-modal">
    <div class="modal-box">
      <!-- Phase 1: PIN -->
      <div id="disc-pin-phase">
        <div class="modal-title">Admin Verification</div>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">Enter admin PIN to apply a discount</div>
        <div class="pin-dots" id="disc-pin-dots">
          <div class="pin-dot"></div><div class="pin-dot"></div>
          <div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <div id="disc-pin-error" style="color:var(--danger);font-size:12px;text-align:center;min-height:16px;margin-bottom:8px"></div>
        <div class="pin-pad" id="disc-pin-pad">
          <button class="pin-key" data-key="1">1</button>
          <button class="pin-key" data-key="2">2</button>
          <button class="pin-key" data-key="3">3</button>
          <button class="pin-key" data-key="4">4</button>
          <button class="pin-key" data-key="5">5</button>
          <button class="pin-key" data-key="6">6</button>
          <button class="pin-key" data-key="7">7</button>
          <button class="pin-key" data-key="8">8</button>
          <button class="pin-key" data-key="9">9</button>
          <button class="pin-key del" data-key="del">⌫</button>
          <button class="pin-key zero" data-key="0">0</button>
        </div>
        <div style="margin-top:14px">
          <button class="btn btn-ghost btn-full" id="disc-pin-cancel">Cancel</button>
        </div>
      </div>
      <!-- Phase 2: Discount input -->
      <div id="disc-input-phase" class="hidden">
        <div class="modal-title">Apply Discount</div>
        <div style="background:var(--bg-card);border-radius:var(--radius-sm);padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:13px;color:var(--text-secondary)">Order Total</span>
            <div style="text-align:right">
              <div style="font-size:18px;font-weight:800" id="disc-order-total">$0.00</div>
              <div style="font-size:12px;color:var(--text-muted)" id="disc-order-total-lbp"></div>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:13px;color:var(--text-secondary)">Admin Cost</span>
            <div style="text-align:right">
              <div style="font-size:14px;font-weight:600;color:var(--text-muted)" id="disc-admin-cost">$0.00</div>
              <div style="font-size:12px;color:var(--text-muted)" id="disc-admin-cost-lbp"></div>
            </div>
          </div>
        </div>
        <div class="field" style="margin-bottom:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <label style="margin:0">Discount Amount</label>
            <div style="display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden">
              <button type="button" class="cur-tog active" id="disc-cur-usd">$ USD</button>
              <button type="button" class="cur-tog" id="disc-cur-lbp">LL LBP</button>
            </div>
          </div>
          <input type="number" class="input" id="disc-amount" placeholder="0.00" min="0" step="0.5">
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost flex-1" id="disc-input-cancel">Cancel</button>
          <button class="btn btn-primary flex-1" id="disc-apply">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="../shared/toast.js"></script>
  <script src="cashier.js"></script>
</body>
</html>
