<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Tables Management</title>
  <link rel="stylesheet" href="../shared/global.css">
  <style>
    body { display: flex; flex-direction: column; overflow: hidden; }
    .body { flex: 1; display: flex; overflow: hidden; }

    .list-panel {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .list-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .list-header span { flex: 1; font-weight: 700; font-size: 14px; }
    .table-list { flex: 1; overflow-y: auto; padding: 8px; }
    .table-row {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      gap: 10px;
      font-size: 14px;
    }
    .table-row:hover { background: var(--bg-card); }
    .table-row-name { flex: 1; font-weight: 500; }
    .table-row-order { font-size: 12px; color: var(--text-muted); }

    .form-panel {
      flex: 1;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 420px;
    }
    .form-panel h2 { font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="btn btn-ghost btn-sm" id="btn-back">← Admin</button>
    <span class="topbar-title">Tables</span>
  </div>

  <div class="body">
    <!-- Table list -->
    <div class="list-panel">
      <div class="list-header">
        <span>Tables</span>
        <button class="btn btn-primary btn-sm" id="btn-new">+ New</button>
      </div>
      <div class="table-list scroll" id="table-list"></div>
    </div>

    <!-- Add / Edit form -->
    <div class="form-panel">
      <h2 id="form-title">Add Table</h2>
      <div class="field">
        <label>Table Name</label>
        <input type="text" class="input" id="name-input" placeholder="e.g. Table 5, Bar Seat 1">
      </div>
      <div class="field">
        <label>Sort Order <small style="color:var(--text-muted)">(lower = first)</small></label>
        <input type="number" class="input" id="order-input" value="0" min="0">
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-primary flex-1" id="btn-save">Save Table</button>
        <button class="btn btn-ghost" id="btn-cancel-form" style="display:none">Cancel</button>
      </div>
      <div id="form-msg" style="font-size:13px;color:var(--danger);min-height:18px"></div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="../shared/toast.js"></script>
  <script src="tables-admin.js"></script>
</body>
</html>
