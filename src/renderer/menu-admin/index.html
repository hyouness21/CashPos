<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Menu Management</title>
  <link rel="stylesheet" href="../shared/global.css">
  <style>
    body { display: flex; flex-direction: column; overflow: hidden; }
    .body { display: flex; flex: 1; overflow: hidden; }

    /* Category sidebar */
    .cat-sidebar {
      width: 220px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }
    .cat-sidebar-header {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .cat-sidebar-header span { font-weight: 700; font-size: 13px; flex: 1; }
    .cat-list { flex: 1; overflow-y: auto; padding: 6px; }
    .cat-item {
      display: flex;
      align-items: center;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      gap: 8px;
      font-size: 13px;
    }
    .cat-item:hover { background: var(--bg-card); }
    .cat-item.active { background: var(--accent); color: #1a1200; font-weight: 600; }
    .cat-item .cat-name { flex: 1; }
    .cat-item .cat-actions { display: flex; gap: 4px; opacity: 0; }
    .cat-item:hover .cat-actions { opacity: 1; }
    .cat-item.active .cat-actions { opacity: 1; }
    .cat-action-btn {
      width: 22px; height: 22px;
      border: none; background: transparent;
      cursor: pointer; border-radius: 4px;
      font-size: 12px;
      display: flex; align-items: center; justify-content: center;
      color: inherit;
    }
    .cat-action-btn:hover { background: rgba(0,0,0,.2); }

    /* Items panel */
    .items-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .items-panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .items-panel-header h2 { font-size: 14px; font-weight: 700; flex: 1; }

    .items-table-wrap { flex: 1; overflow-y: auto; padding: 12px 16px; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 8px 10px;
      font-size: 12px; color: var(--text-muted);
      font-weight: 600; border-bottom: 1px solid var(--border);
      text-transform: uppercase; letter-spacing: .5px;
    }
    td { padding: 10px 10px; font-size: 13px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-card); }
    .td-actions { display: flex; gap: 6px; }

    /* Modal form */
    .form-grid { display: flex; flex-direction: column; gap: 12px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; }

    .currency-toggle { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
    .currency-toggle span { font-size: 12px; color: var(--text-muted); margin-right: 4px; }
    .cur-btn {
      padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary);
      transition: all .12s;
    }
    .cur-btn.active { background: var(--accent); color: #1a1200; border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="btn btn-ghost btn-sm" id="btn-back">← Admin</button>
    <span class="topbar-title">Menu Management</span>
  </div>

  <div class="body">
    <!-- Category sidebar -->
    <div class="cat-sidebar">
      <div class="cat-sidebar-header">
        <span>Categories</span>
        <button class="btn btn-primary btn-sm" id="btn-add-cat">+</button>
      </div>
      <div class="cat-list scroll" id="cat-list"></div>
    </div>

    <!-- Items panel -->
    <div class="items-panel">
      <div class="items-panel-header">
        <h2 id="items-panel-title">Select a category</h2>
        <button class="btn btn-primary btn-sm" id="btn-add-item" disabled>+ Add Item</button>
      </div>
      <div class="items-table-wrap scroll">
        <table id="items-table">
          <thead>
            <tr>
              <th>Name</th><th>Price</th><th>Cost</th><th>Personal Price</th><th>Resale?</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="items-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Category modal -->
  <div class="modal-overlay hidden" id="cat-modal">
    <div class="modal-box">
      <div class="modal-title" id="cat-modal-title">Add Category</div>
      <div class="form-grid">
        <div class="field">
          <label>Category Name</label>
          <input type="text" class="input" id="cat-name-input" placeholder="e.g. Hot Drinks">
        </div>
        <div class="field">
          <label>Sort Order</label>
          <input type="number" class="input" id="cat-order-input" value="0" min="0">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-ghost flex-1" id="cat-modal-cancel">Cancel</button>
        <button class="btn btn-primary flex-1" id="cat-modal-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Item modal -->
  <div class="modal-overlay hidden" id="item-modal">
    <div class="modal-box" style="max-width:520px">
      <div class="modal-title" id="item-modal-title">Add Item</div>
      <div class="form-grid">
        <div class="field">
          <label>Item Name</label>
          <input type="text" class="input" id="item-name-input" placeholder="e.g. Pepsi">
        </div>

        <div class="currency-toggle">
          <span>Enter prices in:</span>
          <button class="cur-btn active" data-cur="usd">$ USD</button>
          <button class="cur-btn" data-cur="lbp">LL LBP</button>
        </div>

        <div class="form-row">
          <div class="field">
            <label id="label-price">Price (USD)</label>
            <input type="number" class="input" id="item-price-input" placeholder="0.00" min="0" step="0.25">
          </div>
          <div class="field">
            <label id="label-cost">Cost (USD)</label>
            <input type="number" class="input" id="item-cost-input" placeholder="0.00" min="0" step="0.01">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label id="label-personal">Personal Price (USD)</label>
            <input type="number" class="input" id="item-personal-price-input" placeholder="0.00" min="0" step="0.25">
          </div>
          <div class="field" style="justify-content:flex-end">
            <label style="visibility:hidden">.</label>
            <label class="form-checkbox">
              <input type="checkbox" id="item-resale-input">
              <span>Resale item</span>
            </label>
          </div>
        </div>
        <div style="font-size:12px;color:var(--text-muted)">
          Resale items get their cost auto-updated when you log a stock purchase.
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-ghost flex-1" id="item-modal-cancel">Cancel</button>
        <button class="btn btn-primary flex-1" id="item-modal-save">Save</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="../shared/toast.js"></script>
  <script src="menu-admin.js"></script>
</body>
</html>
